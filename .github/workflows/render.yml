name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (see Remotion Studio's composition list)"
        required: true
        default: "MontageFinal"
  push:
    branches:
      - main

jobs:
  render:
    name: Render composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx remotion render "${{ github.event.inputs.composition || 'MontageFinal' }}" out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: montage-final
          path: out/video.mp4
