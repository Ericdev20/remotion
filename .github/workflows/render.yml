name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    name: Render MontageFinal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx remotion render MontageFinal out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: montage-final
          path: out/video.mp4
